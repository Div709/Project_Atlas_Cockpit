<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATLAS V2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <header>
        <h1>ATLAS COCKPIT</h1>
    </header>
    <div class="attitude-section">

    <div class="card">
        <h2>PITCH</h2>
        <div id="pitch">0°</div>
    </div>

    <div class="card">
        <h2>ROLL</h2>
        <div id="roll">0°</div>
    </div>

</div>

<div class="horizon-container">

    <div id="horizon">

        <div class="sky"></div>

        <div class="ground"></div>

        <div class="horizon-line"></div>

    </div>

    <div class="aircraft-marker"></div>

</div>

    <div class="cards">

        <div class="card">
            <h2>RPM</h2>
            <div id="rpm">0000</div>
        </div>

        <div class="card">
            <h2>THROTTLE</h2>

            <div class="progress-container">
                <div class="progress-bar" id="throttle-bar"></div>
            </div>

            <div id="throttle-value">0%</div>
        </div>

        <div class="card">
            <h2>ENGINE STATUS</h2>

            <div id="status">
                OFF
            </div>
        </div>

        <div class="card">
            <h2>MOTOR STATUS</h2>

            <div class="motor-status">
                ACTIVE
            </div>
        </div>

    </div>

</div>


</div>

<script src="app.js"></script>

</body>
</html>
